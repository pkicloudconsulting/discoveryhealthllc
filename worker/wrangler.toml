# Cloudflare Worker for the Discovery Health LLC contact form.
#   python3 worker/build.py        (inlines the logo into contact-worker.js)
#   cd worker && npx wrangler deploy
#   npx wrangler secret put RESEND_API_KEY
name = "dh-contact"
main = "contact-worker.js"
compatibility_date = "2024-11-01"

# Rate limiting + duplicate guard (namespace "dh-contact-RATE_LIMIT", created 2026-10-09)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "88bcaebebcf84708a819e1347d8291ef"
